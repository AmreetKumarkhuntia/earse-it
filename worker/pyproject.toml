[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "erase-it-worker"
version = "1.0.0"
description = "Local video selection, tracking and alpha export worker"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = ["numpy==2.2.6", "Pillow==11.3.0"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]
build = ["pyinstaller==6.16.0"]

[project.scripts]
erase-it-worker = "erase_it.__main__:main"

[tool.setuptools.package-data]
erase_it = ["models.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["inference: requires installed SAM 2, torch, and downloaded checkpoint"]
