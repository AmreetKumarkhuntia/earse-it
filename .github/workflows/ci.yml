name: Verify and build Windows app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      SAM2_BUILD_CUDA: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: python scripts/setup-worker.py
      - run: python scripts/prepare-media.py
      - name: Set media tool paths
        shell: pwsh
        run: |
          "LOCAL_CUTOUT_FFMPEG=$pwd/src-tauri/resources/media/ffmpeg.exe" >> $env:GITHUB_ENV
          "LOCAL_CUTOUT_FFPROBE=$pwd/src-tauri/resources/media/ffprobe.exe" >> $env:GITHUB_ENV
      - run: .venv/Scripts/python -m pytest worker/tests -m "not inference" -q
      - run: .venv/Scripts/python -m local_cutout --data-dir .cache/inference --download-model tiny
      - name: Test real CPU inference
        shell: pwsh
        run: |
          $env:LOCAL_CUTOUT_TEST_MODELS = "$pwd/.cache/inference"
          .venv/Scripts/python -m pytest worker/tests -m inference -q
      - run: .venv/Scripts/python scripts/package-worker.py
      - name: Verify frozen runtime
        run: .venv/Scripts/python scripts/check-frozen-worker.py
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: local-cutout-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: third-party-sources-and-notices
          path: |
            dist/third-party-sources/
            licenses/
            src-tauri/resources/media/upstream/
            src-tauri/resources/worker/licenses/
