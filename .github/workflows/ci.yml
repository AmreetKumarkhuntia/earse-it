name: Verify and build Windows app
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
permissions:
  contents: read
env:
  HUSKY: '0'
jobs:
  frontend:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.trigger.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: trigger
        name: Check whether the pushed commit requests a release
        run: node scripts/release-trigger.mjs
      - run: npm ci
      - name: Validate every new commit and the squash title
        env:
          COMMIT_FROM: ${{ github.event.pull_request.base.sha || github.event.before }}
          COMMIT_TO: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ -n "$COMMIT_FROM" && ! "$COMMIT_FROM" =~ ^0+$ ]]; then
            npx --no -- commitlint --from "$COMMIT_FROM" --to "$COMMIT_TO" --verbose
          else
            git log -1 --format=%B "$COMMIT_TO" | npx --no -- commitlint --verbose
          fi
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            printf '%s\n' "$PR_TITLE" | npx --no -- commitlint --verbose
          fi
      - run: npm test
      - run: npm run test:commits
      - run: npm run test:release
      - run: python -m unittest discover -s scripts -p 'test_release.py' -v
      - run: npm run build
  windows:
    needs: frontend
    if: needs.frontend.outputs.release != 'true'
    uses: ./.github/workflows/windows.yml
  release:
    needs: frontend
    if: needs.frontend.outputs.release == 'true'
    permissions:
      contents: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    uses: ./.github/workflows/windows.yml
    with:
      release: true
  nvidia:
    needs: release
    if: needs.release.outputs.version != ''
    permissions:
      contents: write
    uses: ./.github/workflows/nvidia.yml
    with:
      tag: v${{ needs.release.outputs.version }}
