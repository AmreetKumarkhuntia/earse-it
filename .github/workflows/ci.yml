name: Verify and build Windows app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.trigger.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: trigger
        name: Check whether the pushed commit requests a release
        run: node scripts/release-trigger.mjs
      - run: npm ci
      - run: npm test
      - run: npm run test:release
      - run: python -m unittest discover -s scripts -p 'test_release.py' -v
      - run: npm run build
  windows:
    needs: frontend
    if: needs.frontend.outputs.release != 'true'
    uses: ./.github/workflows/windows.yml
  release:
    needs: frontend
    if: needs.frontend.outputs.release == 'true'
    permissions:
      contents: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    uses: ./.github/workflows/windows.yml
    with:
      release: true
  nvidia:
    needs: release
    if: needs.release.outputs.version != ''
    permissions:
      contents: write
    uses: ./.github/workflows/nvidia.yml
    with:
      tag: v${{ needs.release.outputs.version }}
