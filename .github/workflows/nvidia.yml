name: Build optional NVIDIA runtime
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/setup-worker.py --device cuda
      - run: .venv-cuda/Scripts/python scripts/package-worker.py --device cuda
      - uses: actions/upload-artifact@v4
        with:
          name: local-cutout-nvidia-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
            dist/install-nvidia.ps1
          if-no-files-found: error
