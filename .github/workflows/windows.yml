name: Build Windows installer
on:
  workflow_call:
    inputs:
      release:
        description: Build and publish a semantic release after validation
        type: boolean
        default: false
    outputs:
      version:
        description: Published version, empty when no release was created
        value: ${{ jobs.build.outputs.version }}
jobs:
  build:
    outputs:
      version: ${{ steps.publish.outputs.version }}
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      SAM2_BUILD_CUDA: '0'
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: python -m unittest discover -s scripts -p 'test_nvidia.py' -v
      - run: python scripts/setup-worker.py
      - run: python scripts/prepare-media.py
      - name: Set media tool paths
        shell: pwsh
        run: |
          "ERASE_IT_FFMPEG=$pwd/src-tauri/resources/media/ffmpeg.exe" >> $env:GITHUB_ENV
          "ERASE_IT_FFPROBE=$pwd/src-tauri/resources/media/ffprobe.exe" >> $env:GITHUB_ENV
      - run: .venv/Scripts/python -m pytest worker/tests -m "not inference" -q
      - run: .venv/Scripts/python -m erase_it --data-dir .cache/inference --download-model tiny
      - name: Test real CPU inference
        shell: pwsh
        run: |
          $env:ERASE_IT_TEST_MODELS = "$pwd/.cache/inference"
          .venv/Scripts/python -m pytest worker/tests -m inference -q
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Package development installer
        if: ${{ !inputs.release }}
        shell: pwsh
        run: |
          .venv/Scripts/python scripts/package-worker.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python scripts/check-frozen-worker.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run desktop:build
      - name: Version, build, commit, tag, and publish release
        id: publish
        if: inputs.release
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.release }}
        with:
          name: erase-it-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.release }}
        with:
          name: third-party-sources-and-notices
          path: |
            artifacts/third-party-sources/
            licenses/
            src-tauri/resources/media/upstream/
            src-tauri/resources/media/build-configuration.txt
            src-tauri/resources/media/manifest.json
            src-tauri/resources/worker/licenses/
          if-no-files-found: error
      - name: Retain release files, including on publishing failure
        if: ${{ always() && inputs.release }}
        uses: actions/upload-artifact@v4
        with:
          name: erase-it-release-files
          compression-level: 0
          path: artifacts/release/
          if-no-files-found: warn
